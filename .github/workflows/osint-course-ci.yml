name: OSINT course CI

on:
  pull_request:
    paths:
      - 'osint/**'
      - '.github/workflows/osint-course-ci.yml'
  push:
    branches: [main]
    paths:
      - 'osint/**'
      - '.github/workflows/osint-course-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Docusaurus
        run: npm run build
