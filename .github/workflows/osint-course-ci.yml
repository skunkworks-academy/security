name: OSINT course CI

on:
  pull_request:
    paths:
      - 'osint/**'
      - '.github/workflows/osint-course-ci.yml'
  push:
    branches: [main]
    paths:
      - 'osint/**'
      - '.github/workflows/osint-course-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: osint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Build Docusaurus
        id: docusaurus-build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          exit $status
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osint-course-build-log
          path: osint/build.log
          if-no-files-found: warn
          retention-days: 7
