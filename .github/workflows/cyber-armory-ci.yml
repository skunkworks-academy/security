name: Cyber Armory CI and runtime shell check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'armory/**'
      - '.github/workflows/cyber-armory-ci.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'armory/**'
      - '.github/workflows/cyber-armory-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-armory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate attachment-derived catalogue and safety metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};
          for(const file of ['armory/data-1.js','armory/data-2.js','armory/data-3.js','armory/data-4.js','armory/data-5.js','armory/data-6.js','armory/catalog.js']){
            if(!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            vm.runInNewContext(fs.readFileSync(file,'utf8'),sandbox,{filename:file});
          }
          const rows=sandbox.window.SKUNKWORKS_ARMORY;
          if(!Array.isArray(rows)) throw new Error('SKUNKWORKS_ARMORY is not an array');
          if(rows.length<250) throw new Error(`Expected at least 250 attachment-derived resources, found ${rows.length}`);
          const allowed=new Set(['reference','defensive','scoped','lab','offline','privacy']);
          const urls=new Set();
          for(const [i,item] of rows.entries()){
            for(const k of ['n','u','c','d','m']) if(!item[k]||typeof item[k]!=='string') throw new Error(`Row ${i+1} missing ${k}`);
            if(!allowed.has(item.m)) throw new Error(`Row ${i+1} invalid mode ${item.m}`);
            const url=new URL(item.u); if(!['http:','https:'].includes(url.protocol)) throw new Error(`Row ${i+1} unsafe protocol`);
            if(/@|%40/i.test(item.u)) throw new Error(`Row ${i+1} contains email-like value in public URL`);
            const key=item.u.replace(/\/$/,''); if(urls.has(key)) throw new Error(`Duplicate URL ${item.u}`); urls.add(key);
          }
          const categories=new Set(rows.map(x=>x.c));
          if(categories.size<18) throw new Error(`Expected at least 18 capability areas, found ${categories.size}`);
          console.log(`Validated ${rows.length} resources across ${categories.size} categories.`);
          NODE

      - name: Validate main landing page Armory reference
        run: |
          set -euo pipefail
          grep -q '/armory/' index.html
          grep -q 'SKW-SEC-ARM-001' index.html
          grep -q 'Cyber Security Armory' index.html
          grep -q 'academy-navigation.js?v=2026.08.22.2&rev=2026.08.22.2' index.html
          grep -q 'data-skunkworks-global-nav="v10"' index.html

      - name: Validate Armory page and segmented data loading
        run: |
          set -euo pipefail
          grep -q 'SKW-SEC-ARM-001' armory/index.html
          grep -q 'https://security.skunkworksacademy.com/armory/' armory/index.html
          grep -q 'Authorised use only' armory/index.html
          grep -q 'academy-navigation.js?v=' armory/index.html
          grep -q 'data-skunkworks-global-nav="v10"' armory/index.html
          for n in 1 2 3 4 5 6; do grep -q "data-$n.js" armory/index.html; done
          grep -q 'catalog.js' armory/index.html
          grep -q 'Thank you, Patrão — my hero and master in chief.' armory/index.html

      - name: Validate canonical Skunkworks Academy shell runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.22.2&rev=2026.08.22.2' -o /tmp/nav-loader.js
          grep -q 'academy-navigation-v11.js' /tmp/nav-loader.js
          grep -q 'academy-page-contract.css' /tmp/nav-loader.js

          curl -fsSL --retry 3 --retry-delay 2 'https://skunkworksacademy.com/assets/academy-navigation-v11.js?v=2026.08.20.1' -o /tmp/nav-v11.js
          grep -q 'skunkworks-ui.js' /tmp/nav-v11.js
          grep -q 'skunkworks-footer.js' /tmp/nav-v11.js
          grep -q 'skunkworks-design-system.css' /tmp/nav-v11.js

          curl -fsSL --retry 3 --retry-delay 2 'https://skunkworksacademy.com/assets/skunkworks-ui.js?v=2026.08.20.1' -o /tmp/ui.js
          curl -fsSL --retry 3 --retry-delay 2 'https://skunkworksacademy.com/assets/skunkworks-footer.js?v=2026.08.20.1' -o /tmp/footer.js
          grep -q 'swa-global-nav' /tmp/ui.js
          grep -q 'swa-global-footer' /tmp/footer.js
          echo 'Canonical Academy compatibility loader, v11 navigation and footer runtime assets are reachable.'

      - name: Local HTTP smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT; sleep 1
          curl -fsS 'http://127.0.0.1:4173/' -o /tmp/security.html
          grep -q 'Cyber Security Armory' /tmp/security.html
          curl -fsS 'http://127.0.0.1:4173/armory/' -o /tmp/armory.html
          grep -q '<title>Cyber Security Armory | Skunkworks Academy</title>' /tmp/armory.html
          for n in 1 2 3 4 5 6; do curl -fsS "http://127.0.0.1:4173/armory/data-$n.js" >/dev/null; done
          curl -fsS 'http://127.0.0.1:4173/armory/catalog.js' >/dev/null
          echo 'Main Security landing page and complete Armory routes load successfully.'
